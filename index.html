<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1B19" />

    <title>Archil Milorava — Full-stack Web Developer</title>
    <meta name="description" content="Portfolio of Archil Milorava, a full-stack web developer working with React, Next.js, Node.js and MongoDB." />
    <link rel="canonical" href="https://archilmilorava.com/" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://archilmilorava.com/" />
    <meta property="og:title" content="Archil Milorava — Full-stack Web Developer" />
    <meta property="og:description" content="Selected work and experience of a full-stack web developer: React, Next.js, Node.js, MongoDB." />
    <meta property="og:image" content="https://archilmilorava.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Archil Milorava",
        "jobTitle": "Full-stack Web Developer",
        "url": "https://archilmilorava.com/",
        "sameAs": [
          "https://www.linkedin.com/in/archil-milorava-9199a110a/",
          "https://github.com/Archil-Milorava"
        ]
      }
    </script>

    <!-- Start downloading what the first screen needs while the JS bundle loads. -->
    <link rel="preload" href="/fonts/pirveli.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/profile.webp" as="image" type="image/webp" fetchpriority="high" />

    <!-- Paints a dark screen with a loading line before any JS runs; React
         replaces it with the real preloader, which looks the same. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; background: #1c1b19; }
      #boot i { position: absolute; left: 24px; right: 24px; bottom: 32px; height: 1px; background: rgba(255,255,255,.15); overflow: hidden; }
      #boot i::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; animation: boot 1.4s ease-in-out infinite; }
      @keyframes boot { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
